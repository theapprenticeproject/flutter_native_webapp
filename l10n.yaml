# App text lives in lib/l10n/app_<language>.arb. `flutter gen-l10n` (it also runs
# with `flutter pub get`) writes the Dart code into lib/l10n/gen/. The English
# file is the template: a language that lacks a key falls back to English.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
output-dir: lib/l10n/gen
synthetic-package: false
nullable-getter: false
